<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTY1 Mobile Terminal</title>
  <link rel="stylesheet" href="./xterm.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
    }

    body {
      position: relative;
    }

    #terminal {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    #reader {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 12px 14px 18px;
      box-sizing: border-box;
      overflow: auto;
      background: #1e1e1e;
      color: #d4d4d4;
      font: 14px/1.55 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-wrap: anywhere;
      word-break: break-word;
      display: block;
      user-select: text;
      -webkit-user-select: text;
      -webkit-touch-callout: default;
    }

    .reader-block {
      margin: 0 0 10px;
      white-space: pre-wrap;
    }

    .reader-block:last-child {
      margin-bottom: 0;
    }

    .reader-command,
    .reader-code,
    .reader-diff {
      border: 1px solid #3c3c3c;
      border-radius: 8px;
      background: #151515;
      padding: 9px 10px;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: 0.92em;
      line-height: 1.45;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: pre;
      word-break: normal;
      overflow-wrap: normal;
    }

    .reader-command {
      border-color: #315f58;
      background: #12211f;
      color: #b9efe3;
    }

    .reader-status {
      display: inline-block;
      border: 1px solid #4a4634;
      border-radius: 999px;
      background: #232115;
      color: #ffdc8a;
      padding: 4px 9px;
      font-size: 0.9em;
      white-space: normal;
    }

    .reader-tool {
      border: 1px solid #38475f;
      border-radius: 8px;
      background: #151b25;
      padding: 9px 10px;
    }

    .reader-tool-title {
      color: #9cdcfe;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .reader-md h3 {
      margin: 0 0 6px;
      font-size: 1.04em;
      color: #ffffff;
    }

    .reader-md p {
      margin: 0 0 7px;
    }

    .reader-md ul {
      margin: 0 0 7px 18px;
      padding: 0;
    }

    .reader-md code {
      border-radius: 5px;
      background: #2a2a2a;
      padding: 1px 4px;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: 0.92em;
    }

    .reader-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 6px;
      user-select: none;
      -webkit-user-select: none;
    }

    .reader-action {
      border: 1px solid #4b5565;
      border-radius: 999px;
      background: #222834;
      color: #d8dee9;
      font: 12px/1.2 'Segoe UI', system-ui, sans-serif;
      padding: 4px 8px;
    }

    .reader-diff-add { color: #7ee787; }
    .reader-diff-del { color: #ff7b72; }
    .reader-diff-meta { color: #79c0ff; }

    #reader.reader-selecting {
      background: #202124;
    }

    #fallback {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 8px;
      box-sizing: border-box;
      overflow: auto;
      background: #1e1e1e;
      color: #cccccc;
      font: 13px/1.4 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
      user-select: text;
      -webkit-user-select: text;
      -webkit-touch-callout: default;
    }

    .xterm {
      height: 100%;
      padding: 8px;
      box-sizing: border-box;
      background: #1e1e1e;
    }

    .xterm-viewport,
    #reader,
    #fallback {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }

    .xterm-viewport::-webkit-scrollbar,
    #reader::-webkit-scrollbar,
    #fallback::-webkit-scrollbar {
      width: 10px;
    }

    .xterm-viewport::-webkit-scrollbar-thumb,
    #reader::-webkit-scrollbar-thumb,
    #fallback::-webkit-scrollbar-thumb {
      background: #3c3c3c;
      border-radius: 8px;
    }

    .xterm-viewport::-webkit-scrollbar-thumb:hover,
    #reader::-webkit-scrollbar-thumb:hover,
    #fallback::-webkit-scrollbar-thumb:hover {
      background: #505050;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <pre id="reader"></pre>
  <pre id="fallback"></pre>
  <script src="./xterm.js"></script>
  <script src="./addon-fit.js"></script>
  <script>
    window.onerror = function(msg, src, line, col) {
      console.error("GLOBAL_ERR: " + msg + " at " + src + ":" + line + ":" + col);
      return false;
    };

    var terminalHost = document.getElementById("terminal");
    var readerEl = document.getElementById("reader");
    var fallbackEl = document.getElementById("fallback");
    var term = null;
    var fitAddon = null;
    var xtermReady = false;
    var writeCount = 0;
    var readerBuffer = "";
    var readerFlushTimer = null;
    var readerMaxLines = 1200;
    var readerMaxChars = 500000;
    var terminalMirrorBuffer = "";
    var terminalMirrorMaxChars = 500000;
    var fallbackBuffer = "";
    var resizeObserver = null;
    var selectionMode = false;
    var fallbackSyncTimer = null;
    var fallbackSyncDirty = false;
    var fallbackSyncReason = "";
    var appendMaintenanceTimer = null;
    var boundViewport = null;
    var followOutput = true;
    var FALLBACK_SYNC_DEBOUNCE_MS = 280;
    var FALLBACK_MAX_LINES = 1000;
    var INITIAL_RENDER_MAX_CHARS = 200000;
    var INITIAL_RENDER_MAX_LINES = 1000;
    var DEFAULT_FONT_SIZE = 13;
    var LAYOUT_REFIT_DELAYS_MS = [0, 80, 240, 600];
    var renderMode = "mobile-fit";
    var fontScale = 1;
    var targetDesktopCols = 80;
    var targetDesktopRows = 24;
    var layoutPulseToken = 0;
    var writeQueue = [];
    var writeInProgress = false;
    var writeQueuedBytes = 0;
    var writeQueueMaxBytes = 1000000;
    var writeGeneration = 0;
    var ensureLayoutTimer = null;
    var ensureLayoutReason = "";
    var lastReportedAtBottom = null;
    var tuiDetectedReported = false;

    function isReaderMode() {
      return renderMode !== "desktop-mirror";
    }

    function updateRenderSurface() {
      var readerVisible = isReaderMode();
      applyReaderFont();
      if (readerEl) {
        readerEl.removeEventListener("scroll", handleViewportScroll);
        readerEl.style.display = readerVisible ? "block" : "none";
        readerEl.style.pointerEvents = readerVisible ? "auto" : "none";
        readerEl.classList.toggle("reader-selecting", selectionMode);
        if (readerVisible) {
          readerEl.addEventListener("scroll", handleViewportScroll, { passive: true });
        }
      }
      if (terminalHost) {
        terminalHost.style.visibility = readerVisible ? "hidden" : "visible";
        terminalHost.style.pointerEvents = readerVisible ? "none" : "auto";
      }
      if (fallbackEl && readerVisible) {
        fallbackEl.style.display = "none";
        fallbackEl.style.pointerEvents = "none";
      }
      reportScrollAtBottom(true);
    }

    function applyReaderFont() {
      if (!readerEl) return;
      var size = Math.max(12, Math.min(22, 14 * fontScale));
      readerEl.style.fontSize = size + "px";
      readerEl.style.lineHeight = "1.55";
    }

    function healthSnapshot() {
      var screen = document.querySelector(".xterm-screen");
      var canvas = document.querySelector(".xterm-screen canvas");
      return {
        xtermReady: xtermReady,
        termExists: !!term,
        rows: term ? term.rows : 0,
        cols: term ? term.cols : 0,
        writeCount: writeCount,
        screenExists: !!screen,
        screenWidth: screen ? screen.offsetWidth : 0,
        screenHeight: screen ? screen.offsetHeight : 0,
        canvasExists: !!canvas,
        canvasWidth: canvas ? canvas.width : 0,
        canvasHeight: canvas ? canvas.height : 0,
        windowInnerWidth: window.innerWidth || 0,
        windowInnerHeight: window.innerHeight || 0,
        bodyClientWidth: document.body ? document.body.clientWidth : 0,
        bodyClientHeight: document.body ? document.body.clientHeight : 0,
        docClientWidth: document.documentElement ? document.documentElement.clientWidth : 0,
        docClientHeight: document.documentElement ? document.documentElement.clientHeight : 0,
        hostClientWidth: terminalHost ? terminalHost.clientWidth : 0,
        hostClientHeight: terminalHost ? terminalHost.clientHeight : 0,
        hostOffsetWidth: terminalHost ? terminalHost.offsetWidth : 0,
        hostOffsetHeight: terminalHost ? terminalHost.offsetHeight : 0,
        fallbackClientWidth: fallbackEl ? fallbackEl.clientWidth : 0,
        fallbackClientHeight: fallbackEl ? fallbackEl.clientHeight : 0
      };
    }

    function isHealthy() {
      var health = healthSnapshot();
      return !!(
        health.xtermReady &&
        health.termExists &&
        health.rows > 0 &&
        health.cols > 0 &&
        health.screenExists &&
        health.screenWidth > 0 &&
        health.screenHeight > 0 &&
        health.canvasExists &&
        health.canvasWidth > 0 &&
        health.canvasHeight > 0
      );
    }

    function terminalTextToPlain(text, appendTo) {
      var lines = String(appendTo || "").split("\n");
      if (!lines.length) lines = [""];
      var row = lines.length - 1;
      var col = lines[row].length;

      function ensureRow(index) {
        while (lines.length <= index) lines.push("");
      }

      function putChar(ch) {
        ensureRow(row);
        var line = lines[row] || "";
        if (col > line.length) line += " ".repeat(col - line.length);
        lines[row] = line.slice(0, col) + ch + line.slice(col + 1);
        col += 1;
      }

      function clearLine(mode) {
        ensureRow(row);
        var line = lines[row] || "";
        if (mode === 1) {
          lines[row] = line.slice(col);
          col = 0;
        } else if (mode === 2) {
          lines[row] = "";
          col = 0;
        } else {
          lines[row] = line.slice(0, col);
        }
      }

      function csiNumber(params, fallback) {
        var raw = (params || "").replace(/[?>=]/g, "").split(";")[0];
        var value = parseInt(raw, 10);
        return isFinite(value) && value > 0 ? value : fallback;
      }

      var input = String(text || "");
      for (var i = 0; i < input.length; i += 1) {
        var ch = input.charAt(i);
        if (ch === "\u001b") {
          var next = input.charAt(i + 1);
          if (next === "]") {
            var oscEnd = input.indexOf("\u0007", i + 2);
            var stEnd = input.indexOf("\u001b\\", i + 2);
            if (oscEnd < 0 || (stEnd >= 0 && stEnd < oscEnd)) oscEnd = stEnd >= 0 ? stEnd + 1 : input.length - 1;
            i = oscEnd;
            continue;
          }
          if (next === "[") {
            var j = i + 2;
            while (j < input.length && !/[A-Za-z~]/.test(input.charAt(j))) j += 1;
            var finalCh = input.charAt(j);
            var params = input.slice(i + 2, j);
            var amount = csiNumber(params, 1);
            if (finalCh === "A") {
              row = Math.max(0, row - amount);
              col = Math.min(col, (lines[row] || "").length);
            } else if (finalCh === "B") {
              row += amount;
              ensureRow(row);
              col = Math.min(col, (lines[row] || "").length);
            } else if (finalCh === "C") {
              col += amount;
            } else if (finalCh === "D") {
              col = Math.max(0, col - amount);
            } else if (finalCh === "G") {
              col = Math.max(0, amount - 1);
            } else if (finalCh === "K") {
              clearLine(csiNumber(params, 0));
            } else if (finalCh === "J" && csiNumber(params, 0) === 2) {
              lines = [""];
              row = 0;
              col = 0;
            } else if ((finalCh === "H" || finalCh === "f") && params) {
              var parts = params.split(";");
              row = Math.max(0, (parseInt(parts[0] || "1", 10) || 1) - 1);
              col = Math.max(0, (parseInt(parts[1] || "1", 10) || 1) - 1);
              ensureRow(row);
            }
            i = j;
            continue;
          }
          i += 1;
          continue;
        }
        if (ch === "\r") {
          if (input.charAt(i + 1) === "\n") {
            row += 1;
            ensureRow(row);
            col = 0;
            i += 1;
          } else {
            col = 0;
          }
          continue;
        }
        if (ch === "\n") {
          row += 1;
          ensureRow(row);
          col = 0;
          continue;
        }
        if (ch === "\b") {
          col = Math.max(0, col - 1);
          continue;
        }
        if (ch === "\t") {
          var spaces = 4 - (col % 4);
          for (var tabIndex = 0; tabIndex < spaces; tabIndex += 1) putChar(" ");
          continue;
        }
        if (ch >= " ") {
          putChar(ch);
        }
      }
      return normalizeReaderText(lines.join("\n"));
    }

    function normalizeReaderText(text) {
      var source = String(text || "").replace(/[ \t]+\n/g, "\n");
      var lines = source.split("\n");
      var out = [];
      var blankRun = 0;
      var previous = "";
      for (var i = 0; i < lines.length; i += 1) {
        var line = lines[i].replace(/[ \t]+$/g, "");
        if (!line.trim()) {
          blankRun += 1;
          if (blankRun <= 2) out.push("");
          continue;
        }
        blankRun = 0;
        if (line === previous && /(\d+%|⠋|⠙|⠹|⠸|⠼|⠴|⠦|⠧|⠇|⠏|loading|building|running|installing)/i.test(line)) {
          out[out.length - 1] = line;
        } else {
          out.push(line);
        }
        previous = line;
      }
      return out.join("\n").replace(/\n{4,}/g, "\n\n\n");
    }

    function trimReaderBuffer(text) {
      var next = trimToLastLines(text || "", readerMaxLines);
      if (next.length > readerMaxChars) {
        next = next.slice(next.length - readerMaxChars);
      }
      return next.replace(/\n{4,}/g, "\n\n\n");
    }

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function attrPayload(text) {
      return escapeHtml(encodeURIComponent(String(text || "")));
    }

    function readerToolbar(copyText, sendText) {
      var copyPayload = attrPayload(copyText);
      var sendPayload = attrPayload(sendText || "");
      return "<div class=\"reader-toolbar\">" +
        "<button class=\"reader-action\" data-action=\"copy\" data-payload=\"" + copyPayload + "\">复制</button>" +
        (sendText ? "<button class=\"reader-action\" data-action=\"send\" data-payload=\"" + sendPayload + "\">发送</button>" : "") +
        "</div>";
    }

    function markdownInline(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, "<a href=\"$2\">$1</a>");
    }

    function renderMarkdownHtml(lines) {
      var html = [];
      var list = [];
      function flushList() {
        if (!list.length) return;
        html.push("<ul>" + list.map(function(item) { return "<li>" + markdownInline(item) + "</li>"; }).join("") + "</ul>");
        list = [];
      }
      for (var i = 0; i < lines.length; i += 1) {
        var line = lines[i];
        var heading = line.match(/^#{1,3}\s+(.+)$/);
        var bullet = line.match(/^\s*[-*]\s+(.+)$/);
        if (heading) {
          flushList();
          html.push("<h3>" + markdownInline(heading[1]) + "</h3>");
        } else if (bullet) {
          list.push(bullet[1]);
        } else if (line.trim()) {
          flushList();
          html.push("<p>" + markdownInline(line) + "</p>");
        } else {
          flushList();
        }
      }
      flushList();
      return html.join("");
    }

    function extractRunnableCommand(text) {
      var lines = String(text || "").split("\n").map(function(line) { return line.trim(); }).filter(Boolean);
      if (!lines.length) return "";
      var first = lines[0]
        .replace(/^PS [^>]+>\s*/, "")
        .replace(/^[\w.-]+@[\w.-]+:[^$#>]*[$#]\s*/, "")
        .replace(/^[$>#]\s*/, "");
      return first || lines[0];
    }

    function blockTypeFor(lines) {
      var sample = lines.join("\n");
      var first = (lines[0] || "").trim();
      if (/(apply_patch|shell_command|tool_use|cargo check|gradlew|assembleDebug|npm |pnpm |pytest|vitest|playwright|git diff|git status)/i.test(sample)) {
        return "tool";
      }
      if (/^(\$|>|#)\s+\S+/.test(first) || /^PS [^>]+>\s+/.test(first) || /^[\w.-]+@[\w.-]+:[^$#>]*[$#]\s+/.test(first)) {
        return "command";
      }
      if (/^(diff --git|--- |\+\+\+ |@@ )/m.test(sample) || lines.some(function(line) { return /^[+-](?![+-])/.test(line); })) {
        return "diff";
      }
      if (/```/.test(sample) || /^(\s{2,}|\t)*(function |class |const |let |var |import |export |def |fun |if \(|for \(|while \(|return |<\/?[a-z][^>]*>)/m.test(sample)) {
        return "code";
      }
      if (/(waiting for input|press enter|enter to continue|select an option|y\/n|password|token|验证码|配对码|继续\?|是否继续|任务已完成|build successful|finished|completed|done|error|failed|permission denied)/i.test(sample)) {
        return "status";
      }
      return "text";
    }

    function splitReaderBlocks(text) {
      var lines = String(text || "").split("\n");
      var blocks = [];
      var current = [];
      var currentType = "";
      var fence = false;

      function pushCurrent() {
        while (current.length && !current[0].trim()) current.shift();
        while (current.length && !current[current.length - 1].trim()) current.pop();
        if (!current.length) return;
        blocks.push({ type: currentType || blockTypeFor(current), lines: current.slice() });
        current = [];
        currentType = "";
      }

      for (var i = 0; i < lines.length; i += 1) {
        var line = lines[i];
        var startsFence = /^\s*```/.test(line);
        if (startsFence) {
          if (!fence) {
            pushCurrent();
            fence = true;
            currentType = "code";
            current.push(line);
          } else {
            current.push(line);
            pushCurrent();
            fence = false;
          }
          continue;
        }
        if (fence) {
          current.push(line);
          continue;
        }
        if (!line.trim()) {
          if (current.length) pushCurrent();
          continue;
        }
        var nextType = blockTypeFor([line]);
        if (current.length && currentType && nextType !== currentType && (currentType !== "text" || nextType !== "status")) {
          pushCurrent();
        }
        if (!currentType) currentType = nextType;
        current.push(line);
      }
      pushCurrent();
      return blocks.slice(-180);
    }

    function renderDiffHtml(lines) {
      return lines.map(function(line) {
        var cls = "";
        if (/^\+/.test(line)) cls = " reader-diff-add";
        else if (/^-/.test(line)) cls = " reader-diff-del";
        else if (/^(diff --git|@@|--- |\+\+\+ )/.test(line)) cls = " reader-diff-meta";
        return "<span class=\"" + cls.trim() + "\">" + escapeHtml(line) + "</span>";
      }).join("\n");
    }

    function renderReaderDom(autoScroll) {
      if (!readerEl) return;
      var shouldFollow = typeof autoScroll === "boolean" ? autoScroll : isNearBottomEl(readerEl);
      var blocks = splitReaderBlocks(readerBuffer);
      var html = blocks.map(function(block) {
        var body = block.lines.join("\n");
        if (block.type === "diff") {
          return "<div class=\"reader-block reader-diff\">" + readerToolbar(body, false) + "<pre>" + renderDiffHtml(block.lines) + "</pre></div>";
        }
        if (block.type === "command") {
          var command = extractRunnableCommand(body);
          return "<div class=\"reader-block reader-command\">" + readerToolbar(body, command) + "<pre>" + escapeHtml(body) + "</pre></div>";
        }
        if (block.type === "tool") {
          var toolCommand = extractRunnableCommand(body);
          return "<div class=\"reader-block reader-tool\">" + readerToolbar(body, toolCommand) + "<div class=\"reader-tool-title\">工具调用</div><pre class=\"reader-code\">" + escapeHtml(body) + "</pre></div>";
        }
        if (block.type === "code") {
          return "<div class=\"reader-block reader-code\">" + readerToolbar(body, false) + "<pre>" + escapeHtml(body.replace(/^\s*```\w*\n?|\n?\s*```\s*$/g, "")) + "</pre></div>";
        }
        if (block.type === "status") {
          return "<div class=\"reader-block\"><span class=\"reader-status\">" + escapeHtml(body) + "</span></div>";
        }
        return "<div class=\"reader-block reader-md\">" + readerToolbar(body, false) + renderMarkdownHtml(block.lines) + "</div>";
      }).join("");
      readerEl.innerHTML = html || "";
      if (shouldFollow) readerEl.scrollTop = readerEl.scrollHeight;
      reportScrollAtBottom(true);
    }

    function handleReaderAction(event) {
      var target = event.target;
      if (!target || !target.closest) return;
      var button = target.closest(".reader-action");
      if (!button) return;
      event.preventDefault();
      event.stopPropagation();
      var payload = "";
      try {
        payload = decodeURIComponent(button.getAttribute("data-payload") || "");
      } catch (_) {
        payload = button.getAttribute("data-payload") || "";
      }
      if (!payload) return;
      var bridge = window.TermsyncAndroid;
      if (!bridge) return;
      if (button.getAttribute("data-action") === "copy" && typeof bridge.copyReaderText === "function") {
        bridge.copyReaderText(payload);
      } else if (button.getAttribute("data-action") === "send" && typeof bridge.sendReaderCommand === "function") {
        bridge.sendReaderCommand(payload);
      }
    }

    if (readerEl) {
      readerEl.addEventListener("click", handleReaderAction);
    }

    function trimTerminalMirrorBuffer(text) {
      var next = trimToLastLines(text || "", INITIAL_RENDER_MAX_LINES);
      if (next.length > terminalMirrorMaxChars) {
        next = next.slice(next.length - terminalMirrorMaxChars);
      }
      return next;
    }

    function rememberTerminalMirror(data, mode) {
      if (mode === "render") {
        terminalMirrorBuffer = trimTerminalMirrorBuffer(data || "");
      } else if (data) {
        terminalMirrorBuffer = trimTerminalMirrorBuffer(terminalMirrorBuffer + data);
      }
    }

    function rebuildTerminalMirror() {
      if (!term || !xtermReady) return;
      writeGeneration += 1;
      writeQueue = [];
      writeQueuedBytes = 0;
      writeInProgress = false;
      try {
        term.reset();
        if (terminalMirrorBuffer) {
          term.write(terminalMirrorBuffer, function() {
            refreshTerminal();
            term.scrollToBottom();
          });
        }
      } catch (e) {
        console.error("REBUILD_TERMINAL_ERR: " + e.message);
      }
    }

    function flushReader(autoScroll) {
      if (!readerEl) return;
      renderReaderDom(autoScroll);
    }

    function scheduleReaderFlush(autoScroll) {
      if (readerFlushTimer) return;
      readerFlushTimer = setTimeout(function() {
        readerFlushTimer = null;
        flushReader(autoScroll);
      }, 90);
    }

    function writeReader(data, mode, shouldFollowOutput) {
      if (!readerEl) return "ERR:no_reader";
      var shouldFollow = mode === "render" || !!shouldFollowOutput || isNearBottomEl(readerEl);
      if (mode === "render") {
        readerBuffer = terminalTextToPlain(trimInitialRenderText(data || ""), "");
      } else if (data) {
        readerBuffer = terminalTextToPlain(data, readerBuffer);
      }
      readerBuffer = trimReaderBuffer(readerBuffer);
      writeCount += 1;
      scheduleReaderFlush(shouldFollow);
      updateRenderSurface();
      if (writeCount <= 5 || writeCount % 20 === 0) {
        console.log(mode.toUpperCase() + "_READER_OK: data.len=" + (data ? data.length : 0) + " writeCount=" + writeCount + " follow=" + shouldFollow);
      }
      return "OK";
    }

    function isNearBottomEl(el) {
      if (!el) return true;
      return el.scrollTop + el.clientHeight >= el.scrollHeight - 32;
    }

    function flushFallback(autoScroll) {
      if (!fallbackEl) return;
      var shouldFollow = typeof autoScroll === "boolean" ? autoScroll : isNearBottomEl(fallbackEl);
      fallbackEl.textContent = fallbackBuffer;
      if (shouldFollow) {
        fallbackEl.scrollTop = fallbackEl.scrollHeight;
      }
    }

    function normalizeExportedLines(lines) {
      var normalized = [];
      var blankRun = 0;
      for (var i = 0; i < lines.length; i += 1) {
        var line = (lines[i] || "").replace(/[ \t]+$/g, "");
        if (!line.trim()) {
          blankRun += 1;
          if (blankRun > 1) {
            continue;
          }
          normalized.push("");
          continue;
        }
        blankRun = 0;
        normalized.push(line);
      }
      return normalized;
    }

    function trimToLastLines(text, maxLines) {
      if (!text || maxLines <= 0) return text || "";
      var lineCount = 0;
      for (var i = text.length - 1; i >= 0; i -= 1) {
        if (text.charCodeAt(i) === 10) {
          lineCount += 1;
          if (lineCount >= maxLines) {
            return text.slice(i + 1);
          }
        }
      }
      return text;
    }

    function syncFallbackFromTerminal() {
      if (!term || !term.buffer || !term.buffer.active) return false;
      try {
        var buffer = term.buffer.active;
        var lines = [];
        var start = Math.max(0, buffer.length - FALLBACK_MAX_LINES);
        for (var i = start; i < buffer.length; i += 1) {
          var line = buffer.getLine(i);
          if (!line) continue;
          var text = line.translateToString(true).replace(/\u00A0/g, " ");
          if (line.isWrapped && lines.length > 0) {
            lines[lines.length - 1] += text;
          } else {
            lines.push(text);
          }
        }
        fallbackBuffer = normalizeExportedLines(lines).join("\n").replace(/\s+$/g, "");
        return true;
      } catch (e) {
        console.error("FALLBACK_SYNC_ERR: " + e.message);
        return false;
      }
    }

    function applyRawFallback(mode, data) {
      if (!fallbackEl) return;
      var shouldFollow = mode === "render" || isNearBottomEl(fallbackEl);
      if (mode === "render") {
        fallbackBuffer = terminalTextToPlain(data, "");
      } else if (mode === "append" && data) {
        fallbackBuffer = terminalTextToPlain(data, fallbackBuffer);
      }
      flushFallback(shouldFollow);
    }

    function scheduleFallbackSync(reason, immediate, autoScroll) {
      if (!fallbackEl) return;
      if (!selectionMode && fallbackEl.style.display === "none") return;
      fallbackSyncDirty = true;
      fallbackSyncReason = reason || fallbackSyncReason || "unknown";
      if (fallbackSyncTimer && !immediate) {
        return;
      }
      if (fallbackSyncTimer && immediate) {
        clearTimeout(fallbackSyncTimer);
        fallbackSyncTimer = null;
      }
      fallbackSyncTimer = setTimeout(function() {
        fallbackSyncTimer = null;
        if (!fallbackSyncDirty) return;
        fallbackSyncDirty = false;
        var ok = syncFallbackFromTerminal();
        if (!ok) {
          console.warn("FALLBACK_SYNC_RAW[" + fallbackSyncReason + "]");
        }
        flushFallback(autoScroll);
      }, immediate ? 0 : FALLBACK_SYNC_DEBOUNCE_MS);
    }

    function updateFallbackVisibility(forceVisible) {
      if (!fallbackEl) return;
      if (isReaderMode()) {
        fallbackEl.style.display = "none";
        fallbackEl.style.pointerEvents = "none";
        updateRenderSurface();
        return;
      }
      var showFallback = selectionMode || (typeof forceVisible === "boolean" ? forceVisible : !isHealthy());
      fallbackEl.style.display = showFallback ? "block" : "none";
      fallbackEl.style.pointerEvents = showFallback ? "auto" : "none";
      if (terminalHost) {
        terminalHost.style.visibility = showFallback ? "hidden" : "visible";
      }
      if (showFallback) {
        scheduleFallbackSync("visibility", true, true);
      }
    }

    function fit() {
      if (isReaderMode()) return;
      try {
        if (fitAddon) fitAddon.fit();
      } catch (e) {
        console.error("FIT_ERR: " + e.message);
      }
    }

    function refreshTerminal() {
      if (!term || term.rows <= 0) return;
      try {
        term.refresh(0, term.rows - 1);
      } catch (_) {}
    }

    function reportTerminalSize(reason) {
      if (!term || !window.TermsyncAndroid || typeof window.TermsyncAndroid.reportSize !== "function") return;
      try {
        window.TermsyncAndroid.reportSize(term.cols || 0, term.rows || 0, reason || "");
      } catch (e) {
        console.warn("REPORT_SIZE_ERR: " + e.message);
      }
    }

    function maybeReportTuiDetected(data) {
      if (tuiDetectedReported || !data) return;
      if (/\u001b\[\?(47|1047|1048|1049)h|\u001b\[[0-9;?]*[ABCDHf]|\u001b\[\?25[lh]/.test(data)) {
        tuiDetectedReported = true;
        if (window.TermsyncAndroid && typeof window.TermsyncAndroid.reportTuiDetected === "function") {
          window.TermsyncAndroid.reportTuiDetected();
        }
      }
    }

    function ensureLayout(reason) {
      if (ensureLayoutTimer) {
        ensureLayoutReason = ensureLayoutReason || reason || "layout";
        return;
      }
      ensureLayoutReason = reason || ensureLayoutReason || "layout";
      ensureLayoutTimer = setTimeout(function() {
        var runReason = ensureLayoutReason;
        ensureLayoutTimer = null;
        ensureLayoutReason = "";
        performEnsureLayout(runReason);
      }, 32);
    }

    function performEnsureLayout(reason) {
      if (renderMode === "desktop-mirror" && typeof window.termsyncMatchDesktop === "function") {
        window.termsyncMatchDesktop(targetDesktopCols, targetDesktopRows);
        return;
      }
      updateRenderSurface();
      flushReader(isNearBottomEl(readerEl));
    }

    function runLayout(reason) {
      if (typeof window.termsyncEnsureLayout === "function") {
        window.termsyncEnsureLayout(reason);
      } else {
        ensureLayout(reason);
      }
    }

    function pulseLayout(reason) {
      var token = ++layoutPulseToken;
      for (var i = 0; i < LAYOUT_REFIT_DELAYS_MS.length; i += 1) {
        (function(delayMs) {
          setTimeout(function() {
            if (token !== layoutPulseToken) return;
            runLayout((reason || "pulse") + "." + delayMs);
          }, delayMs);
        })(LAYOUT_REFIT_DELAYS_MS[i]);
      }
    }

    function viewport() {
      if (isReaderMode()) return readerEl;
      return boundViewport || document.querySelector(".xterm-viewport");
    }

    function handleViewportScroll() {
      followOutput = isNearBottomEl(viewport());
      reportScrollAtBottom(false);
    }

    function reportScrollAtBottom(force) {
      var atBottom = isNearBottomEl(viewport());
      if (!force && lastReportedAtBottom === atBottom) return;
      lastReportedAtBottom = atBottom;
      if (window.TermsyncAndroid && typeof window.TermsyncAndroid.reportScrollAtBottom === "function") {
        window.TermsyncAndroid.reportScrollAtBottom(atBottom);
      }
    }

    function bindViewportTracking() {
      var el = document.querySelector(".xterm-viewport");
      if (!el || el === boundViewport) return;
      if (boundViewport) {
        boundViewport.removeEventListener("scroll", handleViewportScroll);
      }
      boundViewport = el;
      boundViewport.addEventListener("scroll", handleViewportScroll, { passive: true });
      followOutput = isNearBottomEl(boundViewport);
      reportScrollAtBottom(true);
    }

    function isNearBottom() {
      return isNearBottomEl(viewport());
    }

    function decodeBase64Utf8(base64) {
      if (!base64) return "";
      try {
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder().decode(bytes);
      } catch (e) {
        console.error("B64_DECODE_ERR: " + e.message + " input.len=" + base64.length);
        return "";
      }
    }

    function trimInitialRenderText(text) {
      var next = trimToLastLines(text || "", INITIAL_RENDER_MAX_LINES);
      if (next.length <= INITIAL_RENDER_MAX_CHARS) {
        return next;
      }
      return next.slice(next.length - INITIAL_RENDER_MAX_CHARS);
    }

    function clampFontScale(value) {
      var next = Number(value);
      if (!isFinite(next)) next = 1;
      return Math.max(0.7, Math.min(1.6, next));
    }

    function applyMobileFitFont() {
      if (!term) return;
      term.options.fontSize = Math.max(8, Math.min(24, DEFAULT_FONT_SIZE * fontScale));
    }

    function scheduleAppendMaintenance(reason) {
      if (appendMaintenanceTimer) return;
      appendMaintenanceTimer = setTimeout(function() {
        appendMaintenanceTimer = null;
        bindViewportTracking();
        if (!isHealthy()) {
          ensureLayout(reason + ".recover");
        } else {
          updateFallbackVisibility(false);
        }
      }, 120);
    }

    function afterTerminalWrite(item) {
      if (item.generation !== writeGeneration) {
        return;
      }
      writeCount += 1;
      writeQueuedBytes = Math.max(0, writeQueuedBytes - item.data.length);
      scheduleFallbackSync(item.mode + ".write", item.mode === "render", item.shouldFollowOutput || item.mode === "render");
      if (item.mode === "render") {
        bindViewportTracking();
        ensureLayout(item.mode + ".write");
      } else {
        scheduleAppendMaintenance(item.mode + ".write");
      }
      if (item.shouldFollowOutput || item.mode === "render") {
        requestAnimationFrame(function() {
          term.scrollToBottom();
          followOutput = true;
        });
      }
      if (writeCount <= 5 || writeCount % 20 === 0) {
        console.log(item.mode.toUpperCase() + "_OK: data.len=" + item.data.length + " writeCount=" + writeCount + " queue=" + writeQueue.length + " follow=" + !!item.shouldFollowOutput);
      }
    }

    function drainWriteQueue() {
      if (writeInProgress || !term) return;
      var item = writeQueue.shift();
      if (!item) return;
      writeInProgress = true;
      try {
        if (item.mode === "render") {
          term.reset();
        }
        term.write(item.data, function() {
          try {
            afterTerminalWrite(item);
          } finally {
            if (item.generation === writeGeneration) {
              writeInProgress = false;
              drainWriteQueue();
            }
          }
        });
      } catch (e) {
        writeQueuedBytes = Math.max(0, writeQueuedBytes - item.data.length);
        if (item.generation === writeGeneration) {
          writeInProgress = false;
          drainWriteQueue();
        }
        console.error(item.mode.toUpperCase() + "_EXCEPTION: " + e.message);
        updateFallbackVisibility(true);
      }
    }

    function enqueueTerminalWrite(data, mode, shouldFollowOutput) {
      var generation = writeGeneration;
      if (mode === "render") {
        generation = ++writeGeneration;
        writeQueue = [];
        writeQueuedBytes = 0;
      }
      if (writeQueuedBytes + data.length > writeQueueMaxBytes) {
        console.warn("WRITE_QUEUE_OVERFLOW: queued=" + writeQueuedBytes + " incoming=" + data.length);
        while (writeQueue.length && writeQueuedBytes + data.length > writeQueueMaxBytes) {
          var dropped = writeQueue.shift();
          writeQueuedBytes = Math.max(0, writeQueuedBytes - dropped.data.length);
        }
      }
      writeQueue.push({
        data: data,
        mode: mode,
        shouldFollowOutput: shouldFollowOutput,
        generation: generation
      });
      writeQueuedBytes += data.length;
      drainWriteQueue();
    }

    function writeTerminal(data, mode, shouldFollowOutput) {
      maybeReportTuiDetected(data);
      rememberTerminalMirror(data, mode);
      if (isReaderMode()) {
        return writeReader(data, mode, shouldFollowOutput);
      }
      if (!xtermReady || !term) {
        console.error(mode.toUpperCase() + "_ERR: xterm not ready");
        applyRawFallback(mode, data);
        updateFallbackVisibility(true);
        return "ERR:not_ready";
      }

      try {
        if (mode === "render") {
          data = trimInitialRenderText(data);
        }

        if (!data) {
          scheduleFallbackSync(mode + ".empty", true);
          ensureLayout(mode + ".empty");
          return "OK";
        }

        enqueueTerminalWrite(data, mode, shouldFollowOutput);
        return "OK";
      } catch (e) {
        console.error(mode.toUpperCase() + "_EXCEPTION: " + e.message);
        updateFallbackVisibility(true);
        return "ERR:" + e.message;
      }
    }

    try {
      console.log("XTERM_INIT: Terminal type=" + typeof Terminal);
      console.log("XTERM_INIT: FitAddon type=" + typeof FitAddon);

      if (typeof Terminal === "undefined") {
        console.error("XTERM_INIT: Terminal is undefined");
      } else {
        term = new Terminal({
          convertEol: false,
          cursorBlink: true,
          fontSize: DEFAULT_FONT_SIZE,
          fontFamily: "'Cascadia Code', 'Consolas', 'Courier New', monospace",
          scrollback: 5000,
          theme: {
            background: "#1e1e1e",
            foreground: "#cccccc",
            cursor: "#4ec9b0",
            selectionBackground: "rgba(0,122,204,0.35)",
            black: "#1e1e1e",
            red: "#f44747",
            green: "#4ec9b0",
            yellow: "#cca700",
            blue: "#0e639c",
            magenta: "#c586c0",
            cyan: "#4fc1ff",
            white: "#d4d4d4",
            brightBlack: "#808080",
            brightRed: "#ff6b68",
            brightGreen: "#6ad7be",
            brightYellow: "#dcdcaa",
            brightBlue: "#569cd6",
            brightMagenta: "#d670d6",
            brightCyan: "#9cdcfe",
            brightWhite: "#ffffff"
          }
        });

        if (typeof FitAddon !== "undefined" && FitAddon.FitAddon) {
          fitAddon = new FitAddon.FitAddon();
          term.loadAddon(fitAddon);
          console.log("XTERM_INIT: FitAddon loaded OK");
        } else {
          console.error("XTERM_INIT: FitAddon not available");
        }

        if (!terminalHost) {
          console.error("XTERM_INIT: #terminal element not found");
        } else {
          term.open(terminalHost);
          xtermReady = true;
          bindViewportTracking();
          console.log("XTERM_INIT: Terminal opened OK");
          pulseLayout("init");
        }
      }
    } catch (e) {
      console.error("XTERM_INIT_EXCEPTION: " + e.message + "\n" + e.stack);
      updateFallbackVisibility(true);
    }

    window.addEventListener("resize", function() {
      pulseLayout("window.resize");
    });

    requestAnimationFrame(function() {
      pulseLayout("first.raf");
      console.log("XTERM_INIT: first fit done");
    });

    if (window.ResizeObserver && terminalHost) {
      resizeObserver = new ResizeObserver(function() {
        pulseLayout("resize.observer");
      });
      resizeObserver.observe(terminalHost);
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", function() {
        pulseLayout("visualViewport.resize");
      });
      window.visualViewport.addEventListener("scroll", function() {
        pulseLayout("visualViewport.scroll");
      });
    }

    window.addEventListener("focus", function() {
      pulseLayout("window.focus");
    });

    document.addEventListener("visibilitychange", function() {
      if (!document.hidden) {
        pulseLayout("visibility.visible");
      }
    });

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function() {
        pulseLayout("fonts.ready");
      }).catch(function() {});
    }

    window.termsyncRender = function(data) {
      return writeTerminal(data, "render", false);
    };

    window.termsyncAppend = function(data) {
      if (!data) return "OK:empty";
      bindViewportTracking();
      return writeTerminal(data, "append", isNearBottom());
    };

    window.termsyncRenderBase64 = function(base64) {
      var data = decodeBase64Utf8(base64);
      console.log("RENDER_B64: input.len=" + (base64 ? base64.length : 0) + " decoded.len=" + data.length);
      return window.termsyncRender(data);
    };

    window.termsyncAppendBase64 = function(base64) {
      var data = decodeBase64Utf8(base64);
      if (writeCount <= 5 || writeCount % 20 === 0) {
        console.log("APPEND_B64: input.len=" + (base64 ? base64.length : 0) + " decoded.len=" + data.length);
      }
      return window.termsyncAppend(data);
    };

    window.termsyncFocus = function() {
      if (term) term.focus();
    };

    window.termsyncScrollToBottom = function() {
      if (isReaderMode() && readerEl) {
        readerEl.scrollTop = readerEl.scrollHeight;
      } else if (term) {
        term.scrollToBottom();
      }
      followOutput = true;
      if (fallbackEl) {
        fallbackEl.scrollTop = fallbackEl.scrollHeight;
      }
      reportScrollAtBottom(true);
    };

    window.termsyncEnsureLayout = function(reason) {
      if (renderMode === "desktop-mirror" && typeof window.termsyncMatchDesktop === "function") {
        return window.termsyncMatchDesktop(targetDesktopCols, targetDesktopRows);
      }
      updateRenderSurface();
      flushReader(isNearBottomEl(readerEl));
      return "OK";
    };

    window.termsyncSetRenderMode = function(mode, scale, desktopCols, desktopRows) {
      renderMode = mode === "desktop-mirror" ? "desktop-mirror" : "mobile-fit";
      fontScale = clampFontScale(scale);
      targetDesktopCols = desktopCols > 0 ? desktopCols : targetDesktopCols;
      targetDesktopRows = desktopRows > 0 ? desktopRows : targetDesktopRows;

      updateRenderSurface();
      if (renderMode === "desktop-mirror") {
        var desktopResult = window.termsyncMatchDesktop(targetDesktopCols, targetDesktopRows);
        rebuildTerminalMirror();
        pulseLayout("setRenderMode.desktop");
        return desktopResult;
      }

      try {
        flushReader(isNearBottomEl(readerEl));
        return JSON.stringify({
          ok: true,
          mode: renderMode,
          fontScale: fontScale,
          reader: true,
          length: readerBuffer.length
        });
      } catch (e) {
        console.error("SET_RENDER_MODE_ERR: " + e.message);
        return JSON.stringify({ ok: false, error: e.message, mode: renderMode });
      }
    };

    window.termsyncSetSelectionMode = function(enabled) {
      selectionMode = !!enabled;
      updateRenderSurface();
      if (isReaderMode()) {
        return JSON.stringify({
          selectionMode: selectionMode,
          reader: true,
          readerLength: readerBuffer.length,
          readerMaxLines: readerMaxLines,
          readerMaxChars: readerMaxChars
        });
      }
      if (selectionMode) {
        scheduleFallbackSync("selection.on", true, true);
      } else if (fallbackSyncTimer) {
        clearTimeout(fallbackSyncTimer);
        fallbackSyncTimer = null;
        fallbackSyncDirty = false;
      }
      updateFallbackVisibility();
      return JSON.stringify({
        selectionMode: selectionMode,
        fallbackLength: fallbackBuffer.length,
        fallbackMaxLines: FALLBACK_MAX_LINES,
        syncDebounceMs: FALLBACK_SYNC_DEBOUNCE_MS,
        initialRenderMaxChars: INITIAL_RENDER_MAX_CHARS
      });
    };

    window.termsyncHealthCheck = function() {
      var health = healthSnapshot();
      health.readerVisible = !!readerEl && readerEl.style.display !== "none";
      health.readerLength = readerBuffer.length;
      health.readerMode = isReaderMode();
      health.fallbackVisible = !!fallbackEl && fallbackEl.style.display !== "none";
      health.fallbackLength = fallbackBuffer.length;
      health.selectionMode = selectionMode;
      return JSON.stringify(health);
    };

    window.termsyncMatchDesktop = function(desktopCols, desktopRows) {
      if (!term || !terminalHost || desktopCols <= 0) {
        console.error("MATCH_DESKTOP_ERR: term=" + !!term + " host=" + !!terminalHost + " cols=" + desktopCols);
        return JSON.stringify({ ok: false });
      }

      try {
        // Measure available container width
        var hostStyle = window.getComputedStyle(terminalHost);
        var paddingLeft = parseInt(hostStyle.paddingLeft) || 0;
        var paddingRight = parseInt(hostStyle.paddingRight) || 0;
        var availWidth = terminalHost.clientWidth - paddingLeft - paddingRight;
        // Reserve a bit for scrollbar
        availWidth -= 14;
        if (availWidth <= 0) availWidth = window.innerWidth - 30;

        // Calculate font size to fit desktopCols characters.
        // Monospace char width ≈ fontSize * 0.6 (typical for monospace fonts)
        var charWidthRatio = 0.602;
        var fontSize = Math.floor((availWidth / desktopCols / charWidthRatio) * 10) / 10;
        fontSize = fontSize * fontScale;
        // Clamp between 4px and 16px
        fontSize = Math.max(4, Math.min(16, fontSize));

        console.log("MATCH_DESKTOP: cols=" + desktopCols + " rows=" + desktopRows +
                     " avail=" + availWidth + "px fontSize=" + fontSize + "px");

        // Apply new font size and resize
        term.options.fontSize = fontSize;
        // Disable FitAddon auto-fit and set exact dimensions
        term.resize(desktopCols, desktopRows || 24);

        requestAnimationFrame(function() {
          // After resize, check actual dimensions and fine-tune against both width and height.
          if (fitAddon) {
            var proposed = fitAddon.proposeDimensions();
            if (proposed) {
              var colRatio = proposed.cols > 0 ? proposed.cols / desktopCols : 1;
              var rowRatio = desktopRows > 0 && proposed.rows > 0 ? proposed.rows / desktopRows : 1;
              var ratio = Math.min(colRatio, rowRatio);
              var adjusted = Math.floor(fontSize * ratio * 10) / 10;
              adjusted = Math.max(3, Math.min(16, adjusted));
              if (Math.abs(adjusted - fontSize) >= 0.1) {
                console.log(
                  "MATCH_DESKTOP: fine-tune fontSize " + fontSize + " -> " + adjusted +
                  " proposed=" + proposed.cols + "x" + proposed.rows
                );
                term.options.fontSize = adjusted;
                term.resize(desktopCols, desktopRows || 24);
              }
            }
          }
          refreshTerminal();
          setTimeout(function() {
            var health = healthSnapshot();
            if (!isHealthy()) {
              console.warn("MATCH_DESKTOP_UNHEALTHY: " + JSON.stringify(health));
              updateFallbackVisibility(true);
            } else {
              reportTerminalSize("matchDesktop");
              updateFallbackVisibility(false);
            }
          }, 80);
        });

        return JSON.stringify({
          ok: true,
          fontSize: fontSize,
          cols: desktopCols,
          rows: desktopRows,
          availWidth: availWidth
        });
      } catch (e) {
        console.error("MATCH_DESKTOP_EXCEPTION: " + e.message);
        return JSON.stringify({ ok: false, error: e.message });
      }
    };

    console.log("XTERM_INIT: script complete, xtermReady=" + xtermReady);
  </script>
</body>
</html>
